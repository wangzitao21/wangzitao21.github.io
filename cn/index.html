<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>正在加载…</title></head>
  <body>
    <script>
      fetch('../index.html').then(response => response.text()).then(html => {
        document.open();
        document.write(html);
        document.close();
      });
    </script>

</html>
